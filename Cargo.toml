[workspace]
resolver = "2"
members = [
    "gpt-core",
    "interface",
    "program",
    "tools/parity",
]

[workspace.package]
authors = ["MagicBlock Labs"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/magicblock-labs/p-gpt"

[workspace.dependencies]
gpt-core = { path = "gpt-core" }
p-gpt-interface = { path = "interface" }
pinocchio = { version = "0.11.2", default-features = false }
pinocchio-log = { version = "0.5.1" }
pinocchio-system = { version = "0.6.1", default-features = false }
ephemeral-rollups-pinocchio = { version = "0.17.0" }
mollusk-svm = "0.15.1"
mollusk-svm-bencher = "0.15.1"
solana-account = "4.3.2"
solana-pubkey = "4.2.1"
solana-instruction = "3.4.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
